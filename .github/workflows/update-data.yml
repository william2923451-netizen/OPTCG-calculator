name: 更新環境牌組資料
on:
  schedule:
    - cron: '17 19 * * *'   # 每天台灣時間 03:17
  workflow_dispatch:         # 也可以在 Actions 頁面手動按「Run workflow」
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/update-data.mjs
      - name: 有變動就提交
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "更新環境牌組資料 $(date -u +%F)"
            git push
          fi
